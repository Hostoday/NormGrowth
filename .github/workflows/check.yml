name: Source checks
on: [push, pull_request]
jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip
      - run: python -m pip install -r analysis/requirements.txt
      - run: python -m analysis.check_release
      - run: python -m analysis.reproduce --help
      - run: python -m analysis.plot_core_figures --help
      - run: python experiments/model_code/test_trajectory_sampling.py
