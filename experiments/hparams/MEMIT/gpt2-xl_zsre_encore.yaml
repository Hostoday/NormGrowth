# Actual 1,000-edit ENCORE run preset; use experiments/scripts/run_rgr_batch.py.
# MPES is the cumulative qualifying-observation threshold, not optimizer steps.
# Asset paths are resolved relative to experiments/ by the runner.
alg_name: MEMIT
model_name: gpt2-xl
stats_dir: ../inputs/stats
device: 0
layers:
- 13
- 14
- 15
- 16
- 17
clamp_norm_factor: 0.75
layer_selection: all
fact_token: subject_last
v_num_grad_steps: 20
v_lr: 0.5
v_loss_layer: 47
v_weight_decay: 0.5
kl_factor: 0.0625
mom2_adjustment: true
mom2_update_weight: 20000
rewrite_module_tmp: transformer.h.{}.mlp.c_proj
layer_module_tmp: transformer.h.{}
mlp_module_tmp: transformer.h.{}.mlp
attn_module_tmp: transformer.h.{}.attn
ln_f_module: transformer.ln_f
lm_head_module: lm_head
mom2_dataset: wikipedia
mom2_n_samples: 100000
mom2_dtype: float32
model_parallel: false
bf16: false
encore_enabled: true
encore_mpes_top1_steps: 5
encore_mpes_exclude_first_context: true
encore_norm_lambda: 40.0
